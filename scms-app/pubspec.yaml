name: scms_app
description: SCMS - Code & Cry
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.0
  fluttertoast: ^8.2.8
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  glassmorphism: ^3.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0  # stable version - good choice

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Fonts declaration (must be exactly indented like this)
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700

  # Optional: if you have images or other assets later, add them here
  # assets:
  #   - assets/images/